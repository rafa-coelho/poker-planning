services:
  postgres:
    image: postgres:15-alpine
    container_name: poker-planning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: poker_planning
      POSTGRES_USER: poker_user
      POSTGRES_PASSWORD: poker_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - poker-planning-network

  # Opcional: pgAdmin para administração visual do banco
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: poker-planning-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@poker-planning.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - poker-planning-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  poker-planning-network:
    driver: bridge 